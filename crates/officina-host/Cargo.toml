[package]
name = "officina-host"
description = "Officina host layer: paths, claude invocation, event buffer, quota and state files, collector, platform calls."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
officina-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.21"
# HTTP actions (AD-36): rustls with ring and the platform verifier, so the
# Windows store and an enterprise CA are trusted and no root set is bundled
# (`webpki-roots` stays out). ureq's stable `rustls` feature pulls
# `webpki-roots`, so its unstable `rustls-no-provider` and `_ring` are named
# instead: pinned, since ureq may change them in a minor version.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }

[lints]
workspace = true

[features]
# Compiles `relay::authority`, what only the author may decide (AD-21).
# Enabled by the window; the `officina` binary enables it only for its
# tests, so the shipped exe a session can call holds no authority (P-5).
window-authority = []
# Lets the tests of the `officina` crate point the relay's `git` resolution
# elsewhere through `OFFICINA_TEST_GIT` (story 2.14). Enabled only by that
# crate's dev-dependencies: the exe a session can call never reads it, which
# the CI step that searches its feature graph checks.
test-seams = []

[[test]]
name = "authority"
required-features = ["window-authority"]

[[test]]
name = "relay_http"
required-features = ["window-authority"]

# Approves, stops or resumes the relay of a fixture home through the
# authority, for the e2e fixtures (D-25); never part of a shipped binary.
[[example]]
name = "approve_fixture"
required-features = ["window-authority"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_Security_Credentials", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3.27.0"
