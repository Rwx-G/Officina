[package]
name = "officina-host"
description = "Officina host layer: paths, claude invocation, event buffer, quota and state files, collector, platform calls."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
officina-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.21"
# HTTP actions (AD-36): rustls with ring and the platform verifier, so the
# Windows store and an enterprise CA are trusted and no root set is bundled
# (`webpki-roots` stays out, banned in deny.toml). ureq's stable `rustls`
# feature pulls `webpki-roots`, so its unstable `rustls-no-provider` is named
# instead: pinned, since ureq may change it in a minor version. The ring
# provider is rustls's own feature, given to ureq by `relay::http`, not
# ureq's internal `_ring`. Canaries: `tests/relay_http.rs` (a TLS handshake)
# and CI's "No bundled roots" step.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
# The registry (v0.3 addendum section 3, AD-38 to AD-42): SQLite compiled
# in, so no system library is needed on Windows; `cache` keeps
# `prepare_cached` for the ingestion's statements.
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "cache"] }

[lints]
workspace = true

[features]
# Compiles `relay::authority`, what only the author may decide (AD-21).
# Enabled by the window; the `officina` binary enables it only for its
# tests, so the shipped exe a session can call holds no authority (P-5).
window-authority = []
# Lets the tests of the `officina` crate point the relay's `git` resolution
# elsewhere through `OFFICINA_TEST_GIT` (story 2.14), and pass the fake
# tool's `FAKE_TOOL_` settings to an action, whose environment is otherwise
# the registry's alone (story 2.16). Enabled only by that crate's
# dev-dependencies: the exe a session can call never reads either, which
# the CI step that searches its feature graph checks.
test-seams = []
# The mutants of AD-95, forwarded to officina-core under the same names for
# CI's `mutants` job, which turns them on from the `officina` crate (D-148).
mutant-accept-any-value = ["officina-core/mutant-accept-any-value"]
mutant-accept-superseded = ["officina-core/mutant-accept-superseded"]
mutant-skip-prompt-hash = ["officina-core/mutant-skip-prompt-hash"]
mutant-accept-extra-ref = ["officina-core/mutant-accept-extra-ref"]
mutant-skip-group-approval = ["officina-core/mutant-skip-group-approval"]

[[test]]
name = "authority"
required-features = ["window-authority"]

[[test]]
name = "relay_http"
required-features = ["window-authority"]

[[test]]
name = "registry_schema"
required-features = ["window-authority"]

[[test]]
name = "registry_store"
required-features = ["window-authority"]

[[test]]
name = "registry_ingest"
required-features = ["window-authority"]

[[test]]
name = "registry_read"
required-features = ["window-authority"]

[[test]]
name = "registry_write"
required-features = ["window-authority"]

[[test]]
name = "registry_retention"
required-features = ["window-authority"]

[[test]]
name = "registry_crash"
required-features = ["window-authority"]

[[test]]
name = "registry_triage"
required-features = ["window-authority"]

[[test]]
name = "proposal_ingest"
required-features = ["window-authority"]

[[test]]
name = "proposals_crash"
required-features = ["window-authority"]

[[test]]
name = "registry_orders"
required-features = ["window-authority"]

[[test]]
name = "registry_review"
required-features = ["window-authority"]

# Approves, stops or resumes the relay of a fixture home through the
# authority, for the e2e fixtures (D-25); never part of a shipped binary.
[[example]]
name = "approve_fixture"
required-features = ["window-authority"]

# Writes proposals through `officina mcp`'s writer in a process the restart
# test kills (story 5.17); never part of a shipped binary.
[[example]]
name = "mcp_crash_helper"

# Plays the window's registry writer in a process the registry tests kill
# (stories 3.1 and 3.2); never part of a shipped binary.
[[example]]
name = "registry_crash_helper"
required-features = ["window-authority"]

# Writes the registry of an e2e fixture home through the window's writer at
# an explicit time (D-72); never part of a shipped binary.
[[example]]
name = "registry_fixture"
required-features = ["window-authority"]

# Writes the work orders of an e2e fixture home through the window's writer
# and prints the Orchestrator view the window would build (story 5.8,
# D-72's pattern); never part of a shipped binary.
[[example]]
name = "orchestrator_fixture"
required-features = ["window-authority"]

# One real triage call, the workstation gate of story 3.9 (AD-58), run by
# the owner by hand; never by a test, never part of a shipped binary.
[[example]]
name = "triage_probe"
required-features = ["window-authority"]

# The review call's memory check (story 5.13 AC 14, D-164): one real call,
# run by hand, recorded as research notes E25.
[[example]]
name = "review_probe"
required-features = ["window-authority"]

# The owner's halves of the v0.5 workstation gates (story 5.1: gates 1, 4
# and 8), run by hand from his own console; never by a test, never part of
# a shipped binary. Gate 8 approves a scratch catalogue through the
# authority, hence the feature.
[[example]]
name = "gates_v05"
required-features = ["window-authority"]

# The owner's steps of the v0.6 workstation gates (story 6.1: the work
# network's W3, the login check, gates 1, 3 to 6 and question 10), run by
# hand from his own console; never by a test run of the gates, never part of
# a shipped binary. Its pure helpers' unit tests run with the crate's tests.
[[example]]
name = "workshop_gate_probe"
test = true

# The workshop on a real engine without the window (story 6.8 AC 6 and 7):
# CI's `workshop` job and the workstation's gate 9 and 1 second halves.
# Builds through Build images' own code, hence the feature.
[[example]]
name = "battery_ci"
required-features = ["window-authority"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_Security_Credentials", "Win32_System_Registry", "Win32_System_Environment", "Win32_Storage_FileSystem", "Win32_Networking_WinHttp"] }

[dev-dependencies]
tempfile = "3.27.0"

# The Slice 0 counters of v0.4 (story 4.1, AD-178 gates 1, 4 and 5), run by
# the owner by hand on the real home, read-only; never part of a shipped
# binary.
[[example]]
name = "slice0_probe"
