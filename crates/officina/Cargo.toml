[package]
name = "officina"
description = "Officina command line: hook, quota writer, doctor, headless board."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "officina"

[[bin]]
name = "officina"
path = "src/main.rs"

[[bin]]
name = "officina-fake-claude"
path = "src/bin/officina-fake-claude.rs"
test = false
doc = false

[dependencies]
officina-host.workspace = true
serde_json.workspace = true

[dev-dependencies]
officina-core.workspace = true
# Tests play the window (approve the catalogue) through the authority; the
# binary built alone (`-p officina`), as the release builds it, has none.
officina-host = { workspace = true, features = ["window-authority"] }
tempfile = "3.27.0"

[lints]
workspace = true
