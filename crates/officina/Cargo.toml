[package]
name = "officina"
description = "Officina command line: hook, quota writer, doctor, headless board."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "officina"

[[bin]]
name = "officina"
path = "src/main.rs"

[[bin]]
name = "officina-fake-claude"
path = "src/bin/officina-fake-claude.rs"
test = false
doc = false

[[bin]]
name = "officina-fake-tool"
path = "src/bin/officina-fake-tool.rs"
test = false
doc = false

[[bin]]
name = "officina-fake-docker"
path = "src/bin/officina-fake-docker.rs"
test = false
doc = false

[[bin]]
name = "officina-git-logger"
path = "src/bin/officina-git-logger.rs"
test = false
doc = false

[dependencies]
officina-host.workspace = true
serde_json.workspace = true

[dev-dependencies]
officina-core.workspace = true
# Tests play the window (approve the catalogue) through the authority, and
# point `git` resolution elsewhere; the binary built alone (`-p officina`),
# as the release builds it, has neither.
officina-host = { workspace = true, features = ["window-authority", "test-seams"] }
tempfile = "3.27.0"

[features]
# The mutants of AD-95 (D-148), for CI's `mutants` job only: officina-core
# is a dev-dependency here, so each is forwarded through officina-host
# under the same name. The injection battery (`tests/injection.rs`) must
# fail with each one on.
mutant-accept-any-value = ["officina-host/mutant-accept-any-value"]
mutant-accept-superseded = ["officina-host/mutant-accept-superseded"]
mutant-skip-prompt-hash = ["officina-host/mutant-skip-prompt-hash"]
mutant-accept-extra-ref = ["officina-host/mutant-accept-extra-ref"]
mutant-skip-group-approval = ["officina-host/mutant-skip-group-approval"]

[lints]
workspace = true
