# officina-core is pure (AD-1): time, environment, filesystem and processes
# enter through arguments, so every rule that decides what the author sees
# runs on any CI runner without mocks.
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "core takes now_ms as an argument" },
  { path = "std::time::Instant::now", reason = "core takes now_ms as an argument" },
  { path = "std::env::var", reason = "the environment is read by officina-host" },
  { path = "std::env::var_os", reason = "the environment is read by officina-host" },
  { path = "std::env::vars", reason = "the environment is read by officina-host" },
  { path = "std::process::Command::new", reason = "processes are spawned by officina-host" },
  { path = "std::fs::read", reason = "files are read by officina-host" },
  { path = "std::fs::read_to_string", reason = "files are read by officina-host" },
  { path = "std::fs::write", reason = "files are written by officina-host" },
  { path = "std::fs::File::open", reason = "files are opened by officina-host" },
  { path = "std::fs::File::create", reason = "files are created by officina-host" },
  { path = "std::fs::OpenOptions::open", reason = "files are opened by officina-host" },
  { path = "std::fs::read_dir", reason = "directories are listed by officina-host" },
  { path = "std::fs::metadata", reason = "files are inspected by officina-host" },
]
