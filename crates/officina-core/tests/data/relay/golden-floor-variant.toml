# The golden floor with the same meaning and a different text: comments,
# key order, action and template order, values order, colours, floor name,
# config_dir, no_excerpts, defaults written out, another orchestrator model,
# and an invalid action and template. Its canonical form must equal the
# golden one.
schema = 2
no_excerpts = true
config_dir = "D:/elsewhere/claude-config"
name = "home"
guarded_programs = ["wsl", "SSH", "ansible*", "scp", "ssh"]

[[project]]
actions = ["ping", "status", "broken", "health", "apply-auto", "apply-sensitive", "apply", "check"]
autonomy = "guarded"
color = "terracotta"
path = "Supervision"
name = "supervision"

[project.workshop]
memory_name = "C--path-to-work-Supervision"
review = "all"
hosts = ["*.pkg.example.com", "index.crates.io", "index.crates.io"]
sensitive_paths = ["infra/*.tf", "deploy/**", "deploy/**"]
dockerfile = "tools/workshop.Dockerfile"
mounts = ["_bmad", ".claude"]

[[project]]
name = "notes"
autonomy = "free"
path = "C:/path/to/Notes"

[[action]]
name = "status"
runner = "native"
class = "free"
description = "Service status on one host"
program = "C:/Windows/System32/OpenSSH/ssh.exe"
forwarded_values = "accepted"
args = ["{host}", "systemctl", "status", "--no-pager", "{unit}"]
timeout_s = 540
max_output_kib = 64

[action.params.unit]
pattern = "[a-z0-9-]+\\.service"

[action.params.host]
values = ["db01", "web01", "db01"]

# Not part of the catalogue: its program is relative.
[[action]]
name = "broken"
class = "free"
program = "relative/tool.exe"

[[action]]
name = "apply-sensitive"
class = "human"
description = "Apply a sensitive playbook, once per approval"
runner = "wsl"
program = "/home/user01/venv/bin/ansible-playbook"
args = ["-i", "inventory/lab", "playbooks/{playbook}"]
env = {}
params = { playbook = { values = ["firewall.yml"] } }

[[action]]
name = "check"
class = "free"
runner = "wsl"
distro = "Ubuntu"
description = "Dry run of a playbook on one lab group"
program = "/home/user01/venv/bin/ansible-playbook"
args = ["--check", "--diff", "-i", "inventory/lab", "--limit", "{group}", "playbooks/{playbook}"]
timeout_s = 600

[action.env]
ANSIBLE_CONFIG = "/home/user01/ansible.cfg"

[action.params.group]
pattern = "lab-[a-z0-9-]{1,30}"

[action.params.playbook]
values = ["alerting.yml", "node-exporter.yml"]

[[action]]
check = "check"
class = "after-check"
name = "apply"
description = "Apply a playbook on one lab group after its dry run"
runner = "wsl"
distro = "Ubuntu"
program = "/home/user01/venv/bin/ansible-playbook"
env = { ANSIBLE_CONFIG = "/home/user01/ansible.cfg" }
args = ["--diff", "-i", "inventory/lab", "--limit", "{group}", "playbooks/{playbook}"]
max_output_kib = 256

[action.params.group]
pattern = "lab-[a-z0-9-]{1,30}"

[action.params.playbook]
values = ["alerting.yml", "node-exporter.yml"]

[[credential]]
scheme = "Bearer"
header = "Authorization"
hosts = ["MON2.example.com", "Monitoring.Example.com", "monitoring.example.com"]
name = "monitoring"

[[action]]
url = "http://status.example.com/{page}"
method = "HEAD"
kind = "http"
name = "ping"
class = "free"
description = "Is the status page up"
timeout_s = 540
max_output_kib = 64
params = { page = { values = ["index"] } }

[[action]]
kind = "http"
name = "health"
credential = "monitoring"
class = "free"
method = "GET"
url = "https://monitoring.example.com/api/v1/{check}?host={host}&verbose=1"
description = "Read one check of the monitoring API"
timeout_s = 30
params = { host = { pattern = "[a-z0-9-]+" }, check = { values = ["ready", "health", "ready"] } }

[orchestrator]
model = "haiku"

[[template]]
projects = ["notes", "supervision", "notes"]
name = "release-notes"
prompt = "Draft the release notes of the last {span}\nin docs/notes.md."
description = "Draft the release notes"
params = { span = { values = ["month", "week"] } }

# Not part of the catalogue: its prompt starts with a slash.
[[template]]
name = "compact"
description = "Compact the session"
projects = ["supervision"]
prompt = "/compact"

[[action]]
auto_max_per_hour = 4
args = ["--diff", "-i", "inventory/lab", "--limit", "{group}", "playbooks/{playbook}"]
check = "check"
class = "auto"
description = "Apply the alerting playbook unattended after its dry run"
distro = "Ubuntu"
env = { ANSIBLE_CONFIG = "/home/user01/ansible.cfg" }
name = "apply-auto"
program = "/home/user01/venv/bin/ansible-playbook"
runner = "wsl"
timeout_s = 540
params = { group = { pattern = "lab-[a-z0-9-]{1,30}" }, playbook = { values = ["alerting.yml", "alerting.yml"] } }

[[template]]
model = "sonnet"
name = "dependency-bump"
description = "Bump one dependency and fix what breaks"
projects = ["supervision"]
prompt = "Bump {package} to its latest {level} release, run the tests, fix what breaks, commit."

[template.params.level]
values = ["minor", "patch"]

[template.params.package]
values = ["@scope/pkg", "serde_json", "@scope/pkg"]

[auto_review]
model = "sonnet"

[workshop]
ca_file = "C:/path/to/corporate-ca.pem"
upstream_proxy = "proxy.example.com:8080"
memory_mib = 6144
cpus = 4
max_workers = 3
auth = "login"

[[template]]
name = "isolated-bump"
prompt = "Bump {package}, run the tests, fix what breaks, commit."
projects = ["supervision", "supervision"]
description = "Bump one dependency in the workshop"

[template.workshop]
max_usd = 1.25
max_minutes = 45
base = ["main", "release/2.1"]

[template.params.package]
values = ["serde_json", "serde_json"]
