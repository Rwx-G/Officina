schema = 2
name = "work"
config_dir = "C:/path/to/claude-config"
guarded_programs = ["ansible*", "ssh", "scp", "wsl"]

[[project]]
name = "supervision"
path = "Supervision"
color = "green"
autonomy = "guarded"
actions = ["check", "apply", "apply-sensitive", "status", "health", "ping"]

[[project]]
name = "notes"
path = "C:/path/to/Notes"
color = "blue"
autonomy = "free"
actions = []

[[action]]
name = "check"
description = "Dry run of a playbook on one lab group"
class = "free"
runner = "wsl"
distro = "Ubuntu"
program = "/home/user01/venv/bin/ansible-playbook"
env = { ANSIBLE_CONFIG = "/home/user01/ansible.cfg" }
args = ["--check", "--diff", "-i", "inventory/lab", "--limit", "{group}", "playbooks/{playbook}"]
timeout_s = 600

[action.params.playbook]
values = ["node-exporter.yml", "alerting.yml"]

[action.params.group]
pattern = "lab-[a-z0-9-]{1,30}"

[[action]]
name = "apply"
description = "Apply a playbook on one lab group after its dry run"
class = "after-check"
check = "check"
runner = "wsl"
distro = "Ubuntu"
program = "/home/user01/venv/bin/ansible-playbook"
env = { ANSIBLE_CONFIG = "/home/user01/ansible.cfg" }
args = ["--diff", "-i", "inventory/lab", "--limit", "{group}", "playbooks/{playbook}"]
max_output_kib = 256

[action.params.playbook]
values = ["node-exporter.yml", "alerting.yml"]

[action.params.group]
pattern = "lab-[a-z0-9-]{1,30}"

[[action]]
name = "apply-sensitive"
description = "Apply a sensitive playbook, once per approval"
class = "human"
runner = "wsl"
program = "/home/user01/venv/bin/ansible-playbook"
args = ["-i", "inventory/lab", "playbooks/{playbook}"]

[action.params.playbook]
values = ["firewall.yml"]

[[action]]
name = "status"
description = "Service status on one host"
class = "free"
program = "C:/Windows/System32/OpenSSH/ssh.exe"
args = ["{host}", "systemctl", "status", "--no-pager", "{unit}"]

[action.params.host]
values = ["web01", "db01"]

[action.params.unit]
pattern = "[a-z0-9-]+\\.service"

[[action]]
name = "health"
description = "Read one check of the monitoring API"
class = "free"
kind = "http"
method = "GET"
url = "https://monitoring.example.com/api/v1/{check}?host={host}&verbose=1"
credential = "monitoring"
timeout_s = 30

[action.params.check]
values = ["health", "ready"]

[action.params.host]
pattern = "[a-z0-9-]+"

[[action]]
name = "ping"
description = "Is the status page up"
class = "free"
kind = "http"
method = "HEAD"
url = "http://status.example.com/{page}"

[action.params.page]
values = ["index"]

[[credential]]
name = "monitoring"
hosts = ["monitoring.example.com", "mon2.example.com"]
header = "Authorization"
scheme = "Bearer"
