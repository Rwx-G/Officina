schema = 2
name = "work"
config_dir = "C:/path/to/claude-config"
guarded_programs = ["ansible*", "ssh", "scp", "wsl"]

[[project]]
name = "supervision"
path = "Supervision"
color = "green"
autonomy = "guarded"
actions = ["check", "apply", "apply-sensitive", "apply-auto", "status", "health", "ping"]

[project.workshop]
mounts = [".claude", "_bmad"]
hosts = ["index.crates.io", "*.pkg.example.com"]
dockerfile = "tools/workshop.Dockerfile"
review = "all"
sensitive_paths = ["deploy/**", "infra/*.tf"]
memory_name = "C--path-to-work-Supervision"

[[project]]
name = "notes"
path = "C:/path/to/Notes"
color = "blue"
autonomy = "free"
actions = []

[[action]]
name = "check"
description = "Dry run of a playbook on one lab group"
class = "free"
runner = "wsl"
distro = "Ubuntu"
program = "/home/user01/venv/bin/ansible-playbook"
env = { ANSIBLE_CONFIG = "/home/user01/ansible.cfg" }
args = ["--check", "--diff", "-i", "inventory/lab", "--limit", "{group}", "playbooks/{playbook}"]
timeout_s = 600

[action.params.playbook]
values = ["node-exporter.yml", "alerting.yml"]

[action.params.group]
pattern = "lab-[a-z0-9-]{1,30}"

[[action]]
name = "apply"
description = "Apply a playbook on one lab group after its dry run"
class = "after-check"
check = "check"
runner = "wsl"
distro = "Ubuntu"
program = "/home/user01/venv/bin/ansible-playbook"
env = { ANSIBLE_CONFIG = "/home/user01/ansible.cfg" }
args = ["--diff", "-i", "inventory/lab", "--limit", "{group}", "playbooks/{playbook}"]
max_output_kib = 256

[action.params.playbook]
values = ["node-exporter.yml", "alerting.yml"]

[action.params.group]
pattern = "lab-[a-z0-9-]{1,30}"

[[action]]
name = "apply-sensitive"
description = "Apply a sensitive playbook, once per approval"
class = "human"
runner = "wsl"
program = "/home/user01/venv/bin/ansible-playbook"
args = ["-i", "inventory/lab", "playbooks/{playbook}"]

[action.params.playbook]
values = ["firewall.yml"]

[[action]]
name = "status"
description = "Service status on one host"
class = "free"
program = "C:/Windows/System32/OpenSSH/ssh.exe"
args = ["{host}", "systemctl", "status", "--no-pager", "{unit}"]
forwarded_values = "accepted"

[action.params.host]
values = ["web01", "db01"]

[action.params.unit]
pattern = "[a-z0-9-]+\\.service"

[[action]]
name = "health"
description = "Read one check of the monitoring API"
class = "free"
kind = "http"
method = "GET"
url = "https://monitoring.example.com/api/v1/{check}?host={host}&verbose=1"
credential = "monitoring"
timeout_s = 30

[action.params.check]
values = ["health", "ready"]

[action.params.host]
pattern = "[a-z0-9-]+"

[[action]]
name = "ping"
description = "Is the status page up"
class = "free"
kind = "http"
method = "HEAD"
url = "http://status.example.com/{page}"

[action.params.page]
values = ["index"]

[[action]]
name = "apply-auto"
description = "Apply the alerting playbook unattended after its dry run"
class = "auto"
check = "check"
runner = "wsl"
distro = "Ubuntu"
program = "/home/user01/venv/bin/ansible-playbook"
env = { ANSIBLE_CONFIG = "/home/user01/ansible.cfg" }
args = ["--diff", "-i", "inventory/lab", "--limit", "{group}", "playbooks/{playbook}"]
auto_max_per_hour = 4

[action.params.playbook]
values = ["alerting.yml"]

[action.params.group]
pattern = "lab-[a-z0-9-]{1,30}"

[[credential]]
name = "monitoring"
hosts = ["monitoring.example.com", "mon2.example.com"]
header = "Authorization"
scheme = "Bearer"

[[template]]
name = "dependency-bump"
description = "Bump one dependency and fix what breaks"
projects = ["supervision"]
prompt = "Bump {package} to its latest {level} release, run the tests, fix what breaks, commit."
model = "sonnet"

[template.params.package]
values = ["serde_json", "@scope/pkg"]

[template.params.level]
values = ["patch", "minor"]

[[template]]
name = "release-notes"
description = "Draft the release notes"
projects = ["supervision", "notes"]
prompt = """
Draft the release notes of the last {span}
in docs/notes.md."""

[template.params.span]
values = ["week", "month"]

[[template]]
name = "isolated-bump"
description = "Bump one dependency in the workshop"
projects = ["supervision"]
prompt = "Bump {package}, run the tests, fix what breaks, commit."

[template.params.package]
values = ["serde_json"]

[template.workshop]
base = ["main", "release/2.1"]
max_minutes = 45
max_usd = 1.25

[workshop]
auth = "login"
max_workers = 3
cpus = 4
memory_mib = 6144
upstream_proxy = "proxy.example.com:8080"
ca_file = "C:/path/to/corporate-ca.pem"

[orchestrator]
model = "opus"

[auto_review]
model = "sonnet"
