[workspace]
resolver = "3"
members = ["crates/officina-core", "crates/officina-host", "crates/officina", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Rwx-G/Officina"
authors = ["Rwx-G"]
rust-version = "1.94"

[workspace.dependencies]
officina-core = { path = "crates/officina-core" }
officina-host = { path = "crates/officina-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
