# Single source of truth for the Rust toolchain, read by rustup locally and
# by CI. Bump on our own schedule: update `channel`, run the gates, commit.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
# The workshop's Linux programs (AD-100): officina-gateway and officina-entry.
targets = ["x86_64-unknown-linux-musl"]
profile = "minimal"
