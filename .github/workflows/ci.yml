# The gates every change passes (AD-18). The Windows job is the reference:
# Officina targets Windows until v1. The Linux job keeps the pure crates
# portable from day one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p officina-core -p officina-host -p officina --all-targets --features officina-core/ts -- -D warnings
      - name: Test
        run: cargo test -p officina-core -p officina-host -p officina --features officina-core/ts

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: pnpm
        run: npm install -g pnpm@11
      - name: Format
        run: cargo fmt --all -- --check
      - name: Frontend install
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Frontend build (embedded by the app crate)
        working-directory: app
        run: pnpm build
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features officina-core/ts -- -D warnings
      - name: Test (includes the TypeScript bindings drift check)
        run: cargo test --workspace --features officina-core/ts
      - name: Hook latency and concurrent appends
        # Hosted runners start any process several times slower than a
        # workstation; the test still gates Officina's own cost at 30 ms.
        # They also run the gate's reads and lexing about twice slower, so
        # its own cost (D-19: under 5 ms on the workstation) gets a looser
        # bound that still catches an order-of-magnitude regression.
        env:
          OFFICINA_HOOK_P95_BUDGET_MS: "150"
          OFFICINA_GATE_OWN_COST_BUDGET_MS: "15"
        run: cargo test --release -p officina --test perf -- --ignored --nocapture
      - name: An approval runs once under concurrency
        # AD-33, AD-37: two runs using one approval at once, exactly one wins.
        run: cargo test --release -p officina-host --test approvals_stress -- --ignored
      - name: officina holds no authority
        # AD-21, P-5, D-9. The exe a session can call is built alone, as the
        # release builds it, right before the search: the test build above
        # left one in target/release with the dev-dependency feature on. The
        # window links the authority, so the same search must find the marker
        # there, or the search proves nothing.
        shell: bash
        run: |
          marker=$(sed -n 's/^pub const AUTHORITY_MARKER: &str = "\(.*\)";$/\1/p' crates/officina-host/src/relay/authority.rs)
          test -n "$marker"
          tree=$(cargo tree -p officina -e normal,features)
          grep -q -F 'officina-host feature' <<<"$tree"
          if grep -F window-authority <<<"$tree"; then
            echo "officina enables window-authority outside its tests"; exit 1
          fi
          cargo build --release -p officina-app
          cargo build --release -p officina
          if grep -a -q -F "$marker" target/release/officina.exe; then
            echo "officina.exe contains the authority marker"; exit 1
          fi
          if ! grep -a -q -F "$marker" target/release/officina-app.exe; then
            echo "positive control failed: officina-app.exe lacks the authority marker"; exit 1
          fi
      - name: No bundled roots
        # AD-36, story 2.11 AC 14: HTTP actions trust the Windows store
        # through rustls' platform verifier, so webpki-roots must stay out of
        # the graph of the exe sessions call, on every target. cargo tree
        # says "nothing to print" or "did not match any packages" when the
        # crate is absent; any other output fails, so a cargo error cannot
        # pass for a clean graph. The same query must find rustls, or the
        # search proves nothing.
        shell: bash
        run: |
          out=$(cargo tree -p officina -e normal --target all -i webpki-roots 2>&1) || true
          if grep -q '^webpki-roots v' <<<"$out"; then
            echo "$out"; echo "webpki-roots is in the graph of officina"; exit 1
          fi
          if ! grep -q -e 'nothing to print' -e 'did not match any packages' <<<"$out"; then
            echo "$out"; echo "cargo tree did not answer"; exit 1
          fi
          control=$(cargo tree -p officina -e normal --target all -i rustls 2>&1) || true
          if ! grep -q '^rustls v' <<<"$control"; then
            echo "$control"; echo "positive control failed: rustls not found"; exit 1
          fi
      - name: Frontend checks
        working-directory: app
        run: |
          pnpm check
          pnpm lint
          pnpm test
      - name: e2e fixtures from the real CLI
        working-directory: app
        run: |
          cargo build -p officina
          node scripts/e2e-fixtures.mjs
      - name: Playwright
        working-directory: app
        run: |
          pnpm exec playwright install chromium
          pnpm e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: app/playwright-report

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: cargo deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: pnpm audit
        working-directory: app
        run: |
          npm install -g pnpm@11
          pnpm audit --prod
