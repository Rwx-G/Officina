# The gates every change passes (AD-18). The Windows job is the reference:
# Officina targets Windows until v1. The Linux job keeps the pure crates
# portable from day one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p officina-core -p officina-host -p officina --all-targets --features officina-core/ts -- -D warnings
      - name: Test
        run: cargo test -p officina-core -p officina-host -p officina --features officina-core/ts

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: pnpm
        run: npm install -g pnpm@11
      - name: Format
        run: cargo fmt --all -- --check
      - name: Frontend install
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Frontend build (embedded by the app crate)
        working-directory: app
        run: pnpm build
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features officina-core/ts -- -D warnings
      - name: Test (includes the TypeScript bindings drift check)
        run: cargo test --workspace --features officina-core/ts
      - name: Hook latency and concurrent appends
        # Hosted runners start any process several times slower than a
        # workstation; the test still gates Officina's own cost at 30 ms.
        env:
          OFFICINA_HOOK_P95_BUDGET_MS: "150"
        run: cargo test --release -p officina --test perf -- --ignored --nocapture
      - name: Frontend checks
        working-directory: app
        run: |
          pnpm check
          pnpm lint
          pnpm test
      - name: e2e fixtures from the real CLI
        working-directory: app
        run: |
          cargo build -p officina
          node scripts/e2e-fixtures.mjs
      - name: Playwright
        working-directory: app
        run: |
          pnpm exec playwright install chromium
          pnpm e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: app/playwright-report

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: cargo deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: pnpm audit
        working-directory: app
        run: |
          npm install -g pnpm@11
          pnpm audit --prod
