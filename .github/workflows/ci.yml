# The gates every change passes (AD-18). The Windows job is the reference:
# Officina targets Windows until v1. The Linux job keeps the pure crates
# portable from day one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories land whether or not anyone pushes: the audit job runs weekly
  # on its own, the build jobs only on a change.
  schedule:
    - cron: "0 5 * * 1"
  # A run by hand needs no push: GitHub stops the schedule after 60 days
  # without activity in the repository.
  workflow_dispatch:
    inputs:
      update_snapshots:
        # D-119, D-508: the scene's screenshot baselines are made here, on
        # the reference runner, and committed only once the owner has
        # compared them with the prototype's render.
        description: "Write the Playwright screenshot baselines and upload them as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

# D-1072: a newer push or pull request update cancels the run still going
# for the same ref; the `changes` job diffs from the last green push run,
# so the commits of a cancelled run are tested by the next one. Scheduled
# and manual runs are never cancelled, and tags run in release.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # D-1073: what the change touches, so a docs-only change skips the build
    # jobs. A push is diffed from the last push run of this workflow on main
    # that went green, not from the commit before it: a run cancelled by a
    # newer push, or a red one, leaves its commits in the next diff. A pull
    # request is diffed from its base. A schedule, a manual run, a history
    # without that commit or an answer-less API runs everything.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.changed.outputs.code }}
      docs: ${{ steps.changed.outputs.docs }}
      workshop: ${{ steps.changed.outputs.workshop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Changed paths
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          everything() {
            printf 'code=true\ndocs=true\nworkshop=true\n' >> "$GITHUB_OUTPUT"; exit 0
          }
          case "$EVENT" in
            schedule|workflow_dispatch) everything ;;
            pull_request) base="$PR_BASE" ;;
            *) base=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty') || everything ;;
          esac
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$HEAD" 2>/dev/null; then everything; fi
          echo "diffing $base..$HEAD"
          # Story 6.8 AC 6 (AD-125, review F54): what the images, the
          # gateway, the entry point and their rules are made of.
          workshop_paths='^(docker/|crates/officina-container/|crates/officina-core/src/workshop/|crates/officina-host/src/workshop/|crates/officina-host/examples/battery_ci\.rs$|tests/vectors/(workshop|gateway)\.json$|\.github/workflows/ci\.yml$)'
          code=false; docs=false; workshop=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [[ "$path" =~ $workshop_paths ]]; then workshop=true; fi
            # docs/assets holds the logos the app copies: code.
            if [[ "$path" == docs/assets/* ]]; then code=true
            elif [[ "$path" == docs/* || "$path" == *.md ]]; then docs=true
            else code=true
            fi
          done < <(git diff --name-only "$base" "$HEAD")
          printf 'code=%s\ndocs=%s\nworkshop=%s\n' "$code" "$docs" "$workshop" | tee -a "$GITHUB_OUTPUT"

  docs:
    # D-1073: a docs-only change still runs the tests that read the docs
    # (the README and CHANGELOG against the code, the research notes core
    # cites); a code change runs them in core-linux and windows.
    needs: changes
    if: needs.changes.outputs.code != 'true' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: The README and CHANGELOG against the code
        run: cargo test --locked -p officina --test readme
      - name: Core's unit tests, which read the research notes
        run: cargo test --locked -p officina-core --lib

  core-linux:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked -p officina-core -p officina-host -p officina -p officina-container --all-targets --features officina-core/ts -- -D warnings
      - name: Test
        run: cargo test --locked -p officina-core -p officina-host -p officina -p officina-container --features officina-core/ts
      - name: The workshop's Linux programs, static
        # Story 6.5 AC 1 (AD-100, the gate 9 entry): officina-gateway and
        # officina-entry for the musl target with rust-lld, no C toolchain.
        run: cargo build --locked --release -p officina-container --target x86_64-unknown-linux-musl
      - name: The entry point's Linux tests
        # Story 6.7 AC 4 (D-224): run, pack, auth-status and scan with real
        # git and a fake claude. The step fails when no test ran, so a cfg
        # mistake that compiles them out turns the job red.
        shell: bash
        run: |
          cargo test --locked -p officina-container --test entry_linux 2>&1 | tee "$RUNNER_TEMP/entry_linux.log"
          grep -q -E "test result: ok\. [1-9][0-9]* passed" "$RUNNER_TEMP/entry_linux.log"
      - name: The launch half without the authority
        # Story 5.2 AC 7 (AD-73, D-128 review F5): the host's spawn tests
        # built alone, so no other package turns window-authority on; the
        # test that every launch kind is refused compiles only then.
        run: cargo test --locked -p officina-host --lib spawn
      - name: The engine's launch half without the authority
        # Story 6.3 AC 5 (AD-97, D-204): the engine driver built alone, so
        # every launch kind is refused before any docker process starts.
        run: cargo test --locked -p officina-host --lib workshop::engine

  windows:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: pnpm
        # An exact version, bumped on purpose like the toolchain: a new
        # pnpm can change what `pnpm audit` reports with no commit here.
        run: npm install -g pnpm@11.5.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Frontend install
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Frontend build (embedded by the app crate)
        working-directory: app
        run: pnpm build
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --features officina-core/ts -- -D warnings
      - name: Test (includes the TypeScript bindings drift check)
        run: cargo test --locked --workspace --features officina-core/ts
      - name: The launch half without the authority
        # Story 5.2 AC 7 (AD-73, D-128 review F5): the host's spawn tests
        # built alone, so no other package turns window-authority on; the
        # test that every launch kind is refused compiles only then.
        run: cargo test --locked -p officina-host --lib spawn
      - name: The engine's launch half without the authority
        # Story 6.3 AC 5 (AD-97, D-204): the engine driver built alone, so
        # every launch kind is refused before any docker process starts.
        run: cargo test --locked -p officina-host --lib workshop::engine
      - name: The workshop's Linux programs, static
        # Story 6.5 AC 1 (AD-100): the cross build from Windows, so the
        # release's path cannot rot between releases.
        run: cargo build --locked --release -p officina-container --target x86_64-unknown-linux-musl
      - name: Hook and gate latency, concurrent appends
        # Every #[ignore]d test of perf.rs. Hosted runners start any process
        # several times slower than a workstation; the test still gates
        # Officina's own cost at 30 ms. They also run the gate's reads and
        # lexing about twice slower, so its own cost (D-19: under 5 ms on
        # the workstation) gets a looser bound that still catches an
        # order-of-magnitude regression. The gate's in-process p95 bound is
        # a workstation check (OFFICINA_PERF_WORKSTATION=1), not set here.
        env:
          OFFICINA_HOOK_P95_BUDGET_MS: "150"
          OFFICINA_GATE_OWN_COST_BUDGET_MS: "15"
        run: cargo test --locked --release -p officina --test perf -- --ignored --nocapture
      - name: The gate's lexer against Git Bash's own parse
        # Story 2.16 AC 4: Git Bash pretty-prints each command of gate.json
        # and of the variants built from the gate's constants, running none;
        # a guarded program bash reads that the lexer misses fails the step.
        # Without Git Bash the test says so and passes.
        run: cargo test --locked -p officina --test lexer_differential -- --ignored --nocapture
      - name: An approval runs once under concurrency
        # AD-33, AD-37: two runs using one approval at once, exactly one wins.
        run: cargo test --locked --release -p officina-host --test approvals_stress -- --ignored
      - name: A killed writer loses no event
        # Story 3.2 AC 11, D-89: the crash helper is killed inside a chunk's
        # transaction and at 20 random points while it ingests, and (story
        # 3.7 AC 3) inside a confirmation's transaction and at 20 random
        # points while it confirms; each seed is printed for a replay. A
        # test target alone does not build examples.
        run: |
          cargo build --locked --release -p officina-host --features window-authority --example registry_crash_helper
          cargo test --locked --release -p officina-host --features window-authority --test registry_crash -- --ignored --nocapture
      - name: A restart loses and duplicates no proposal
        # Story 5.17 AC 7, D-89, D-165: `officina mcp`'s writer killed
        # between a temporary file and its rename and at 20 random points,
        # then the real `officina mcp` killed during `propose_recap`; the
        # window's ingestion, run twice and after a restart, stores every
        # renamed proposal once and no temporary file.
        run: |
          cargo build --locked --release -p officina-host --example mcp_crash_helper
          cargo test --locked --release -p officina-host --features window-authority --test proposals_crash -- --ignored --nocapture
          cargo test --locked --release -p officina --test mcp killing_officina_mcp_during_propose_recap -- --ignored --nocapture
      - name: officina holds no authority
        # AD-21, P-5, D-9. The exe a session can call is built alone, as the
        # release builds it, right before the search: the test build above
        # left one in target/release with the dev-dependency features on. The
        # window links the authority, so the same search must find the marker
        # there, or the search proves nothing. The test seams (story 2.14)
        # stay out of its feature graph too. The registry's writer carries a
        # marker of its own, which officina.exe must not hold either and the
        # window, which calls the writer, must (AD-38, D-83).
        shell: bash
        run: |
          marker=$(sed -n 's/^pub const AUTHORITY_MARKER: &str = "\(.*\)";$/\1/p' crates/officina-host/src/relay/authority.rs)
          test -n "$marker"
          registry_marker=$(sed -n 's/^pub const REGISTRY_MARKER: &str = "\(.*\)";$/\1/p' crates/officina-host/src/registry/write.rs)
          test -n "$registry_marker"
          tree=$(cargo tree --locked -p officina -e normal,features)
          grep -q -F 'officina-host feature' <<<"$tree"
          if grep -F -e window-authority -e test-seams <<<"$tree"; then
            echo "officina enables window-authority or test-seams outside its tests"; exit 1
          fi
          cargo build --locked --release -p officina-app
          cargo build --locked --release -p officina
          if grep -a -q -F "$marker" target/release/officina.exe; then
            echo "officina.exe contains the authority marker"; exit 1
          fi
          if ! grep -a -q -F "$marker" target/release/officina-app.exe; then
            echo "positive control failed: officina-app.exe lacks the authority marker"; exit 1
          fi
          if grep -a -q -F "$registry_marker" target/release/officina.exe; then
            echo "officina.exe contains the registry writer's marker"; exit 1
          fi
          if ! grep -a -q -F "$registry_marker" target/release/officina-app.exe; then
            echo "positive control failed: officina-app.exe lacks the registry writer's marker"; exit 1
          fi
      - name: Registry dependencies
        # v0.3 addendum section 3, D-91: the registry adds rusqlite and
        # nothing the addendum rules out. Scoped to the host crate, since
        # Tauri brings some of those crates into the workspace. The same
        # query must list rusqlite, or the search proves nothing.
        shell: bash
        run: |
          crates=$(cargo tree --locked -p officina-host -e normal --target all --prefix none | awk '{print $1}' | sort -u)
          if ! grep -q -x rusqlite <<<"$crates"; then
            echo "positive control failed: rusqlite not found"; exit 1
          fi
          if grep -x -E 'sqlx|diesel|refinery|rand|tokio' <<<"$crates"; then
            echo "officina-host depends on a crate the v0.3 addendum rules out"; exit 1
          fi
      - name: No bundled roots
        # AD-36, story 2.11 AC 14: HTTP actions trust the Windows store
        # through rustls' platform verifier, so webpki-roots must stay out of
        # the graph of the exe sessions call, on every target. cargo tree
        # says "nothing to print" or "did not match any packages" when the
        # crate is absent; any other output fails, so a cargo error cannot
        # pass for a clean graph. The same query must find rustls, or the
        # search proves nothing.
        shell: bash
        run: |
          out=$(cargo tree --locked -p officina -e normal --target all -i webpki-roots 2>&1) || true
          if grep -q '^webpki-roots v' <<<"$out"; then
            echo "$out"; echo "webpki-roots is in the graph of officina"; exit 1
          fi
          if ! grep -q -e 'nothing to print' -e 'did not match any packages' <<<"$out"; then
            echo "$out"; echo "cargo tree did not answer"; exit 1
          fi
          control=$(cargo tree --locked -p officina -e normal --target all -i rustls 2>&1) || true
          if ! grep -q '^rustls v' <<<"$control"; then
            echo "$control"; echo "positive control failed: rustls not found"; exit 1
          fi
      # Before the frontend checks: Vitest cases read the fixture boards
      # through their index (D-101, D-181).
      - name: e2e fixtures from the real CLI
        working-directory: app
        run: |
          cargo build --locked -p officina
          node scripts/e2e-fixtures.mjs
      - name: Frontend checks
        working-directory: app
        run: |
          pnpm check
          pnpm lint
          pnpm test
      - name: Playwright
        working-directory: app
        # Three times over (D-91): a case that passes once and fails once is
        # a flake to fix, not a pass. A snapshot run writes the baselines
        # once instead, missing or not.
        shell: bash
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          pnpm exec playwright install chromium
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            pnpm e2e --update-snapshots=all
          else
            pnpm e2e --repeat-each=3
          fi
      - name: Screenshot baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-snapshots
          path: app/e2e/*-snapshots/
          if-no-files-found: error
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: app/playwright-report

  workshop:
    # Story 6.8 AC 6 (AD-100, AD-125, D-224, review F54): the workshop on a
    # real Linux engine. Weekly, and on a change to what the images, the
    # gateway, the entry point or their rules are made of, as the `changes`
    # job reads it. hadolint, the musl build, the gateway and base images
    # built through battery_ci.rs with Build images' own code, the programs
    # measured, one allowed and one refused connection through the real
    # gateway; the escape battery joins in story 6.10.
    needs: changes
    if: needs.changes.outputs.workshop == 'true'
    runs-on: ubuntu-latest
    env:
      # The battery never runs claude: the base installs this version, and
      # battery_ci.rs checks `claude --version` against it.
      CLAUDE_CODE_VERSION: "2.1.316"
      HADOLINT_VERSION: "v2.15.1"
      HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: hadolint
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" "https://github.com/hadolint/hadolint/releases/download/$HADOLINT_VERSION/hadolint-linux-x86_64"
          echo "$HADOLINT_SHA256  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" docker/*.Dockerfile
      - name: The Linux programs, static
        run: cargo build --locked --release -p officina-container --target x86_64-unknown-linux-musl
      - name: Images, measured programs and the real gateway
        shell: bash
        run: |
          floor="$RUNNER_TEMP/officina.toml"
          printf 'schema = 2\n[workshop]\nauth = "oauth-token"\nupstream_proxy = "none"\n' > "$floor"
          cargo run --locked -p officina-host --features window-authority --example battery_ci -- \
            --floor "$floor" --linux target/x86_64-unknown-linux-musl/release \
            --claude-version "$CLAUDE_CODE_VERSION" --home "$RUNNER_TEMP/officina-home" | tee "$RUNNER_TEMP/battery_ci.log"
          grep -q -x "BATTERY-CI-OK" "$RUNNER_TEMP/battery_ci.log"

  mutants:
    # AD-95's mutation row, D-148 (review F22): each mutant of the launch
    # path, a core feature skipping one check, must compile, then turn the
    # injection battery red through the case that guards it (the battery
    # names it `guarded by <feature>`); the control run without them passes.
    # The features are read from officina-core's manifest, so a new mutant
    # joins the job by being declared.
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Each mutant turns its guarding case red
        shell: bash
        run: |
          features=$(sed -n 's/^\(mutant-[a-z-]*\) = \[\]$/\1/p' crates/officina-core/Cargo.toml)
          test -n "$features"
          for feature in $features; do
            cargo test --locked -p officina --test injection --features "$feature" --no-run
            if cargo test --locked -p officina --test injection --features "$feature" > "mutant.log" 2>&1; then
              cat mutant.log; echo "$feature: the injection battery stayed green"; exit 1
            fi
            if ! grep -q -F "(guarded by $feature)" mutant.log; then
              cat mutant.log; echo "$feature: no case guarded by it failed"; exit 1
            fi
            echo "$feature: caught"
          done
      - name: Control run without the mutants
        run: cargo test --locked -p officina --test injection

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: cargo deny
        run: |
          # An exact version, bumped on purpose like the toolchain: a new
          # cargo-deny can change what an advisory scope reports.
          cargo install cargo-deny --locked --version 0.19.4
          cargo deny --locked check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: pnpm audit
        # Dev dependencies too: they run on the author's machine and in CI.
        # A finding without a fixed version is listed, with its reason, in
        # app/pnpm-workspace.yaml.
        working-directory: app
        run: |
          npm install -g pnpm@11.5.3
          pnpm audit
