# Builds the Windows artifacts of a version tag (AD-18): the NSIS installer of
# the window and a portable zip of both executables, with SHA-256 sums.
# Binaries are unsigned until a signing certificate exists (risk R7).
name: Release

on:
  push:
    tags: ["v*"]

# The build runs third-party code (crates, npm packages, build scripts) with a
# read-only token; only the publish job, which runs nothing but `gh`, can
# write to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: pnpm
        run: npm install -g pnpm@11.5.3
      - name: Check the tag matches the workspace version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, workspace $version"; exit 1; }
      - name: Frontend install
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Window and installer
        working-directory: app
        # The bundle overlay builds the CLI first and ships it next to the app;
        # both builds take --locked (the script and the overlay pass it on).
        run: pnpm bundle
      - name: CLI
        run: cargo build --locked --release -p officina
      - name: The shipped binaries are the ones CI checks
        # The checks of ci.yml's "officina holds no authority" and "No
        # bundled roots", on the very files the package takes (story 2.16):
        # officina.exe holds no authority marker and enables neither the
        # authority nor the test seams, officina-app.exe holds the marker
        # (positive control), and webpki-roots stays out of the graph
        # while rustls is in it (positive control).
        shell: bash
        run: |
          marker=$(sed -n 's/^pub const AUTHORITY_MARKER: &str = "\(.*\)";$/\1/p' crates/officina-host/src/relay/authority.rs)
          test -n "$marker"
          tree=$(cargo tree --locked -p officina -e normal,features)
          grep -q -F 'officina-host feature' <<<"$tree"
          if grep -F -e window-authority -e test-seams <<<"$tree"; then
            echo "officina enables window-authority or test-seams outside its tests"; exit 1
          fi
          if grep -a -q -F "$marker" target/release/officina.exe; then
            echo "officina.exe contains the authority marker"; exit 1
          fi
          if ! grep -a -q -F "$marker" target/release/officina-app.exe; then
            echo "positive control failed: officina-app.exe lacks the authority marker"; exit 1
          fi
          out=$(cargo tree --locked -p officina -e normal --target all -i webpki-roots 2>&1) || true
          if grep -q '^webpki-roots v' <<<"$out"; then
            echo "$out"; echo "webpki-roots is in the graph of officina"; exit 1
          fi
          if ! grep -q -e 'nothing to print' -e 'did not match any packages' <<<"$out"; then
            echo "$out"; echo "cargo tree did not answer"; exit 1
          fi
          control=$(cargo tree --locked -p officina -e normal --target all -i rustls 2>&1) || true
          if ! grep -q '^rustls v' <<<"$control"; then
            echo "$control"; echo "positive control failed: rustls not found"; exit 1
          fi
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/portable
          cp target/release/officina.exe target/release/officina-app.exe README.md LICENSE dist/portable/
          (cd dist/portable && 7z a "../officina-${version}-windows-x64-portable.zip" . > /dev/null)
          cp target/release/bundle/nsis/*-setup.exe "dist/officina-${version}-windows-x64-setup.exe"
          (cd dist && sha256sum *.zip *.exe > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: dist
      - name: Publish a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"             --title "Officina $GITHUB_REF_NAME" --notes "See CHANGELOG.md." --draft
