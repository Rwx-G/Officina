# cargo deny policy (AD-18). Run: cargo deny check
[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }, { triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
# Vulnerabilities fail the build wherever they sit in the graph. "Unmaintained"
# notices are checked on our direct dependencies only: the ones reported today
# (proc-macro-error, zbus_names, zvariant) come in through Tauri's Linux and
# macro stacks, which we cannot replace; they are re-evaluated with each Tauri
# upgrade.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# MPL-2.0 is accepted for crates Tauri pulls in (file-level copyleft, used
# unmodified, compatible with distributing Apache-2.0 binaries).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
# HTTP actions trust the platform store through rustls' platform verifier
# (AD-36): a bundled root set never enters the graph, on any target. CI's
# "No bundled roots" step checks the exe sessions call too, with a positive
# control.
deny = [{ crate = "webpki-roots", reason = "AD-36: trust comes from the platform store, never a bundled root set" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
